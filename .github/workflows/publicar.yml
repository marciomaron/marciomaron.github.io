name: Publicar site

# Publica o site a cada envio (git push) para a branch main.
# Também roda duas vezes por dia para publicar artigos agendados (data futura):
# 00:10 e 07:10 no horário de Brasília. Nessas rodadas, só republica se houver
# página nova ou atualizada.

on:
  push:
    branches: [main]
  schedule:
    - cron: "10 3,10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar o site
        run: npm run build

      - name: Comparar com o site no ar
        id: diff
        run: node scripts/indexnow.mjs comparar

      - name: Preparar publicação
        if: github.event_name != 'schedule' || steps.diff.outputs.changed == 'true'
        uses: actions/configure-pages@v6

      - name: Enviar arquivos
        if: github.event_name != 'schedule' || steps.diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Publicar no GitHub Pages
        id: deployment
        if: github.event_name != 'schedule' || steps.diff.outputs.changed == 'true'
        uses: actions/deploy-pages@v5

      - name: Avisar buscadores (IndexNow)
        if: steps.deployment.outcome == 'success' && steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: node scripts/indexnow.mjs enviar
